<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Lab Tracker{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    {% block head %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Flash Messages -->
    {% if flash_messages %}
    <div class="fixed top-4 right-4 z-50 space-y-2" id="flash-container">
        {% for flash in flash_messages %}
        <div class="flash-message px-4 py-3 rounded-lg shadow-lg max-w-md animate-fade-in
            {% if flash.category == 'success' %}bg-green-100 border border-green-400 text-green-800
            {% elif flash.category == 'error' %}bg-red-100 border border-red-400 text-red-800
            {% elif flash.category == 'warning' %}bg-yellow-100 border border-yellow-400 text-yellow-800
            {% else %}bg-blue-100 border border-blue-400 text-blue-800{% endif %}"
            role="alert">
            <div class="flex items-center justify-between">
                <span>{{ flash.message }}</span>
                <button type="button" class="ml-4 text-lg font-semibold leading-none hover:opacity-75" onclick="this.parentElement.parentElement.remove()">
                    &times;
                </button>
            </div>
        </div>
        {% endfor %}
    </div>
    <script>
        // Auto-dismiss flash messages after 5 seconds
        setTimeout(function() {
            document.querySelectorAll('.flash-message').forEach(function(el) {
                el.style.opacity = '0';
                el.style.transition = 'opacity 0.5s';
                setTimeout(function() { el.remove(); }, 500);
            });
        }, 5000);
    </script>
    {% endif %}

    {% block body %}
    <main class="container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>
    {% endblock %}
</body>
</html>
