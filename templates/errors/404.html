{% extends "base.html" %}

{% block title %}Page Not Found - Lab Tracker{% endblock %}

{% block body %}
<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
        <h1 class="text-9xl font-bold text-gray-300">404</h1>
        <h2 class="mt-4 text-2xl font-bold text-gray-900">Page Not Found</h2>
        <p class="mt-2 text-gray-600">The page you're looking for doesn't exist or has been moved.</p>
        <div class="mt-8 space-x-4">
            <a href="/" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700">
                Go to Dashboard
            </a>
            <a href="/projects" class="inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md shadow-sm text-gray-700 bg-white hover:bg-gray-50">
                View Projects
            </a>
        </div>
    </div>
</div>
{% endblock %}
